# Retroid Pocket SM8250: capture is a bit-exact passthrough to a backend fixed
# at S16_LE by sm8250_be_hw_params_fixup(), so an S24 frontend records noise.
monitor.alsa.rules = [
  {
    matches = [
      {
        media.class = "Audio/Source"
        api.alsa.path = "hw:RetroidPocket,2"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
        audio.channels = 2
      }
    }
  }
]
